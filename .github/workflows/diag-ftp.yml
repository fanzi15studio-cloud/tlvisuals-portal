name: Diagnostic connexion Hostinger

on:
  push:
    branches:
      - claude/eager-hopper-5s1pzb

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp netcat-openbsd dnsutils >/dev/null

      - name: Resolve and probe ports
        env:
          HOST: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Longueur du nom d'hôte : ${#HOST}"
          case "$HOST" in ftp://*|ftps://*|*/*) echo "ATTENTION : le secret contient un schéma ou un chemin";; esac
          echo "Résolution DNS :"; getent hosts "$HOST" || echo "ÉCHEC DNS"
          for p in 21 22 65002; do nc -z -w 10 "$HOST" $p && echo "port $p OUVERT" || echo "port $p fermé ou filtré"; done

      - name: Try FTPS (explicit TLS) login
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set net:timeout 15; set net:max-retries 1; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; open -u \"$U\",\"$P\" \"$HOST\"; cls -1 /public_html | head -20" && echo "FTPS : CONNEXION OK" || echo "FTPS : ÉCHEC"
