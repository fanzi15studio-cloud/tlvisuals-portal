name: Build & Deploy to Hostinger

# Hostinger refuse les connexions FTP/SSH venant de GitHub : on passe par l'API
# Hostinger (HTTPS), fichier par fichier, dans public_html/cv-digital/ uniquement.
# L'endpoint « deploy » de l'API n'est PAS utilisé : il écrase tout le site.

on:
  push:
    branches:
      - main
      - claude/eager-hopper-5s1pzb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  HOSTINGER_USER: u798510914
  HOSTINGER_DOMAIN: thomasloiseauvisuals.com
  TARGET_DIR: cv-digital

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: List websites on the Hostinger account
        env:
          TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n[:space:]')
          curl -sS "https://developers.hostinger.com/api/hosting/v1/websites" -H "Authorization: Bearer $TOKEN" \
            | jq -r '(.data // .)[]? | "\(.username // "?")  \(.domain // "?")  \(.is_enabled // "")"' || true

      - name: Upload to Hostinger via API
        env:
          TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Secret HOSTINGER_API_TOKEN absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '\r\n[:space:]')   # un retour à la ligne collé avec le jeton casse les en-têtes
          API=https://developers.hostinger.com/api/hosting/v1
          cd out

          # Identifiants d'envoi : demandés une fois, renouvelés si Hostinger les refuse.
          get_creds() {
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o /tmp/creds.json -w '%{http_code}' -X POST "$API/files/upload-urls" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
                -d "{\"username\":\"$HOSTINGER_USER\",\"domain\":\"$HOSTINGER_DOMAIN\"}")
              if [ "$code" = 200 ] && [ -n "$(jq -r '.url // empty' /tmp/creds.json)" ]; then
                url=$(jq -r .url /tmp/creds.json); auth=$(jq -r .auth_key /tmp/creds.json); rest=$(jq -r .rest_auth_key /tmp/creds.json)
                return 0
              fi
              echo "upload-urls : HTTP $code, nouvel essai dans $((attempt * 10)) s"
              sleep $((attempt * 10))
            done
            echo "::error::Impossible d'obtenir une URL d'envoi Hostinger : $(head -c 300 /tmp/creds.json)"
            exit 1
          }

          upload() {   # $1 = fichier local, $2 = chemin distant ; renvoie 1 si refusé
            local dest="$url/$TARGET_DIR/$2?override=true" size
            size=$(stat -c%s "$1")
            curl -sS --retry 2 --fail -o /dev/null -X POST "$dest" \
              -H "X-Auth: $auth" -H "X-Auth-Rest: $rest" -H "Tus-Resumable: 1.0.0" \
              -H "Upload-Length: $size" -H "Upload-Offset: 0" || return 1
            curl -sS --retry 2 --fail -o /dev/null -X PATCH "$dest" \
              -H "X-Auth: $auth" -H "X-Auth-Rest: $rest" -H "Tus-Resumable: 1.0.0" \
              -H "Content-Type: application/offset+octet-stream" -H "Upload-Offset: 0" \
              --data-binary "@$1" || return 1
            echo "envoyé : $TARGET_DIR/$2 ($size octets)"
          }

          get_creds
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            if ! upload "$f" "$rel"; then
              echo "envoi refusé pour $rel : renouvellement des identifiants"
              sleep 5; get_creds
              upload "$f" "$rel" || { echo "::error::Échec définitif pour $rel"; exit 1; }
            fi
            count=$((count + 1))
          done < <(find . -type f -print0 | sort -z)
          echo "$count fichiers envoyés."

      - name: Verify live page
        run: |
          for i in $(seq 1 12); do
            if curl -s "https://$HOSTINGER_DOMAIN/$TARGET_DIR/?v=$GITHUB_SHA" | grep -q "Curriculum vitae"; then
              echo "En ligne : https://$HOSTINGER_DOMAIN/$TARGET_DIR/"; exit 0
            fi
            sleep 10
          done
          echo "::error::La page en ligne ne montre pas encore le nouveau CV."; exit 1
