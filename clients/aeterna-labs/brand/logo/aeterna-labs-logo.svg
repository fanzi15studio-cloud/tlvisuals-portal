<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-label="Aeterna Labs — Research Peptides">
  <title>Aeterna Labs — Research Peptides</title>
  <defs>
    <linearGradient id="ael-gold" gradientUnits="userSpaceOnUse" x1="410" y1="120" x2="410" y2="520">
      <stop offset="0" stop-color="#e0be78"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#a9843a"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500&display=swap');
      .ae-serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;}
      .ae-sans{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;}
    </style>
  </defs>

  <!-- Monogramme Æ : remplissage navy, liseré or (paint-order: contour derrière le fond) -->
  <text x="410" y="300" text-anchor="middle" class="ae-serif" font-weight="700"
        font-size="300" fill="#1A3F55" stroke="#C9A84C" stroke-width="7"
        paint-order="stroke" letter-spacing="-6">&#198;</text>

  <!-- Filet or décoratif -->
  <line x1="250" y1="372" x2="570" y2="372" stroke="#C9A84C" stroke-width="2"/>

  <!-- Wordmark : AETERNA (navy) + LABS (or) -->
  <text x="410" y="452" text-anchor="middle" class="ae-serif" font-weight="600"
        font-size="84" letter-spacing="6"><tspan fill="#1A3F55">AETERNA </tspan><tspan fill="#C9A84C">LABS</tspan></text>

  <!-- Tagline -->
  <text x="410" y="500" text-anchor="middle" class="ae-sans" font-weight="500"
        font-size="26" letter-spacing="12" fill="#C9A84C">RESEARCH PEPTIDES</text>
</svg>
